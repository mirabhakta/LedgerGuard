
name: Deploy LedgerGuard to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend and backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            linuxuser@"$DEPLOY_HOST" "bash -s -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd /home/linuxuser/LedgerGuard

          # Update code
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Uncommitted changes on server"
            exit 1
          fi

          git fetch origin main
          git merge --ff-only "$1"

          # Update backend dependencies
          .venv/bin/python -m pip install -e .

          # Rebuild frontend
          cd frontend
          npm ci
          npm run build
          cd ..

          # Publish frontend
          rsync -a --delete frontend/dist/ /var/www/ledgerguard/

          # Restart backend
          sudo -n /usr/bin/systemctl restart ledgerguard.service

          # Verify backend
          for i in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend healthy"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Backend health check failed"
              exit 1
            fi
            sleep 2
          done

          # Verify frontend
          curl -fsS --max-time 10 http://127.0.0.1/ > /dev/null

          echo "Deployment complete!"
          REMOTE
