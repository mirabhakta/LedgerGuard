name: Test and deploy LedgerGuard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run backend tests (excluding live and slow tests)
        run: LEDGERGUARD_DATASET=data PYTHONPATH=. python -m pytest -q -m 'not live and not slow'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and type-check frontend
        working-directory: frontend
        run: npm run build

      - name: Save frontend build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ledgerguard-dist
          path: frontend/dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Vultr
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download validated frontend build
        uses: actions/download-artifact@v4
        with:
          name: ledgerguard-dist
          path: dist/

      - name: Configure deploy SSH key and verified host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update backend, dependencies, and verify API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes linuxuser@"$DEPLOY_HOST" "bash -s -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd /home/linuxuser/LedgerGuard

          # Protect edits made directly on the server.
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Deployment blocked: uncommitted tracked edits exist on the server."
            git status --short
            exit 1
          fi

          git fetch origin main
          git merge --ff-only "$1"

          # Installs dependencies added to pyproject.toml; keeps .env and data intact.
          .venv/bin/python -m pip install -e .

          sudo -n /usr/bin/systemctl restart ledgerguard.service
          systemctl is-active --quiet ledgerguard.service

          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: backend failed its health check"
          exit 1
          REMOTE

      - name: Publish frontend to Nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e 'ssh -o BatchMode=yes -o IdentitiesOnly=yes' dist/ linuxuser@"$DEPLOY_HOST":/var/www/ledgerguard/
          ssh -o BatchMode=yes -o IdentitiesOnly=yes linuxuser@"$DEPLOY_HOST" \
            'test -s /var/www/ledgerguard/index.html && curl -fsS --max-time 10 http://127.0.0.1/ > /dev/null && echo "Frontend healthy"'
