name: Test and deploy LedgerGuard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Download QuickBooks test data
        run: |
          python -m pip install huggingface_hub
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from shutil import copy2, copyfileobj
          from tarfile import open as open_tar
          from huggingface_hub import hf_hub_download

          companies = {
              'company-001', 'company-045', 'company-048',
              'company-049', 'company-073',
          }
          archive_path = hf_hub_download(
              repo_id='CL251215/QuickBooks-Hackathon-2026',
              repo_type='dataset',
              filename='hackathon-100-participant.tar.gz',
          )
          dest = Path('data/raw/hackathon-100')
          dest.mkdir(parents=True, exist_ok=True)
          copy2('data/index.json', dest / 'index.json')

          extracted = 0
          with open_tar(archive_path, 'r:gz') as archive:
              for member in archive:
                  if not member.isfile():
                      continue
                  parts = PurePosixPath(member.name).parts
                  if '..' in parts:
                      raise SystemExit('Unsafe archive path')
                  company_at = next(
                      (i for i, part in enumerate(parts) if part in companies),
                      None,
                  )
                  if company_at is None:
                      continue
                  target = dest.joinpath(*parts[company_at:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'Unable to read {member.name}')
                  with source, target.open('wb') as output:
                      copyfileobj(source, output)
                  extracted += 1

          print(f'Extracted {extracted} files from QuickBooks archive')
          for company in sorted(companies):
              manifests = list((dest / company / 'rwm-v4').glob('world-*/manifest.yaml'))
              if len(manifests) != 1:
                  raise SystemExit(f'Missing or duplicate RWM world for {company}: {len(manifests)}')
          print('QuickBooks test data ready')
          PY

      - name: Run backend tests (excluding live and slow tests)
        run: |
          LEDGERGUARD_DATASET=data/raw/hackathon-100 PYTHONPATH=. python -m pytest -q -m 'not live and not slow'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and type-check frontend
        working-directory: frontend
        run: npm run build

      - name: Save frontend build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ledgerguard-dist
          path: frontend/dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Vultr
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download validated frontend build
        uses: actions/download-artifact@v4
        with:
          name: ledgerguard-dist
          path: dist/

      - name: Configure deploy SSH key and verified host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update backend, dependencies, and verify API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes linuxuser@"$DEPLOY_HOST" "bash -s -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd /home/linuxuser/LedgerGuard

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Deployment blocked: uncommitted tracked edits exist on the server."
            git status --short
            exit 1
          fi

          git fetch origin main
          git merge --ff-only "$1"
          .venv/bin/python -m pip install -e .

          sudo -n /usr/bin/systemctl restart ledgerguard.service
          systemctl is-active --quiet ledgerguard.service

          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: backend failed its health check"
          exit 1
          REMOTE

      - name: Publish frontend to Nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e 'ssh -o BatchMode=yes -o IdentitiesOnly=yes' dist/ linuxuser@"$DEPLOY_HOST":/var/www/ledgerguard/
          ssh -o BatchMode=yes -o IdentitiesOnly=yes linuxuser@"$DEPLOY_HOST" \
            'test -s /var/www/ledgerguard/index.html && curl -fsS --max-time 10 http://127.0.0.1/ > /dev/null && echo "Frontend healthy"'
